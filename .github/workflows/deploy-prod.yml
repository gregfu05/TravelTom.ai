name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to promote to production
        required: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: azure-prod
    concurrency:
      group: azure-prod-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
      API_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_API_PROD }}
      WEB_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_WEB_PROD }}
      API_IMAGE_NAME: traveltom-api
      WEB_IMAGE_NAME: traveltom-web
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$REGISTRY_NAME" ]] && missing+=("AZURE_CONTAINER_REGISTRY_NAME")
          [[ -z "$RESOURCE_GROUP" ]] && missing+=("AZURE_RESOURCE_GROUP_PROD")
          [[ -z "$API_APP_NAME" ]] && missing+=("AZURE_CONTAINER_APP_API_PROD")
          [[ -z "$WEB_APP_NAME" ]] && missing+=("AZURE_CONTAINER_APP_WEB_PROD")
          [[ -z "$IMAGE_TAG" ]] && missing+=("image_tag")
          [[ -z "$DATABASE_URL" ]] && missing+=("PROD_DATABASE_URL")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required environment vars: ${missing[*]}"
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current active revisions
        id: current
        shell: bash
        run: |
          set -euo pipefail
          api_revision=$(az containerapp show -n "$API_APP_NAME" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          web_revision=$(az containerapp show -n "$WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          echo "api_revision=$api_revision" >> "$GITHUB_OUTPUT"
          echo "web_revision=$web_revision" >> "$GITHUB_OUTPUT"

      - name: Compute revision suffix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha=$(echo "$IMAGE_TAG" | cut -c1-7 | tr '[:upper:]' '[:lower:]')
          revision_suffix="prod-${short_sha}"
          echo "revision_suffix=$revision_suffix" >> "$GITHUB_OUTPUT"

      - name: Run production migrations
        run: |
          docker build -f apps/api/Dockerfile -t traveltom-api-migrate .
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            traveltom-api-migrate \
            alembic -c apps/api/alembic.ini upgrade head

      - name: Deploy API revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}-api"

      - name: Deploy web revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_NAME.azurecr.io/$WEB_IMAGE_NAME:$IMAGE_TAG" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}-web"

      - name: Resolve prod URLs
        id: urls
        shell: bash
        run: |
          api_fqdn=$(az containerapp show -n "$API_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          web_fqdn=$(az containerapp show -n "$WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "api_url=https://${api_fqdn}" >> "$GITHUB_OUTPUT"
          echo "web_url=https://${web_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Run API smoke
        shell: pwsh
        run: ./scripts/smoke-api.ps1 -BaseUrl '${{ steps.urls.outputs.api_url }}'

      - name: Run web smoke
        shell: pwsh
        run: ./scripts/smoke-web.ps1 -BaseUrl '${{ steps.urls.outputs.web_url }}'

      - name: Roll back API revision on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision activate \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ steps.current.outputs.api_revision }}"

      - name: Roll back web revision on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision activate \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ steps.current.outputs.web_revision }}"
