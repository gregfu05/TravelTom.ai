name: Quality Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python format, lint, type-check, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black (check)
        run: black --check .

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy apps/api

      - name: Pytest
        run: python -m pytest -q

  backend-seed-smoke:
    name: Backend DB seed smoke
    runs-on: ubuntu-latest
    needs: python-quality

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: traveltom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traveltom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/traveltom
      APP_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Force missing cleaned snapshot
        run: rm -f traveltom/datasets/business_SB_Cleaned.parquet

      - name: Ensure vector extension exists
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              db_url = os.environ["DATABASE_URL"].replace("+asyncpg", "")
              conn = await asyncpg.connect(db_url)
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await conn.close()


          asyncio.run(main())
          PY

      - name: Run migrations
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Seed catalog with fallback dataset copy
        run: |
          set -euo pipefail
          python scripts/seed_catalog.py --truncate --batch-size 1000 | tee seed.log
          grep -q "copied from raw snapshot" seed.log

      - name: Verify cleaned dataset and seed row count
        run: |
          test -f traveltom/datasets/business_SB_Cleaned.parquet
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              db_url = os.environ["DATABASE_URL"].replace("+asyncpg", "")
              conn = await asyncpg.connect(db_url)
              try:
                  row_count = await conn.fetchval("SELECT COUNT(*) FROM catalog_items")
              finally:
                  await conn.close()
              if row_count is None or int(row_count) <= 0:
                  raise RuntimeError(f"Expected seeded catalog_items rows, got {row_count}")
              print(f"catalog_items rows: {row_count}")


          asyncio.run(main())
          PY

  frontend-quality:
    name: Frontend type-check and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: |
          npm install --include=optional
          # Work around npm optional-deps bug on GitHub Linux runners.
          npm ls @rollup/rollup-linux-x64-gnu >/dev/null 2>&1 || npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Frontend type-check
        run: npm run typecheck

      - name: Frontend build
        run: npm run build
