name: Rollback Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      api_revision:
        description: API revision name to reactivate
        required: true
      web_revision:
        description: Web revision name to reactivate
        required: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'prod' && 'azure-prod' || 'azure-dev' }}
    concurrency:
      group: rollback-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ github.event.inputs.environment == 'prod' && vars.AZURE_RESOURCE_GROUP_PROD || vars.AZURE_RESOURCE_GROUP_DEV }}
      API_APP_NAME: ${{ github.event.inputs.environment == 'prod' && vars.AZURE_CONTAINER_APP_API_PROD || vars.AZURE_CONTAINER_APP_API_DEV }}
      WEB_APP_NAME: ${{ github.event.inputs.environment == 'prod' && vars.AZURE_CONTAINER_APP_WEB_PROD || vars.AZURE_CONTAINER_APP_WEB_DEV }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore API revision traffic
        run: |
          az containerapp revision activate \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ github.event.inputs.api_revision }}"

      - name: Restore web revision traffic
        run: |
          az containerapp revision activate \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ github.event.inputs.web_revision }}"

      - name: Resolve rollback URLs
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          api_fqdn=$(az containerapp show -n "$API_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          web_fqdn=$(az containerapp show -n "$WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "api_url=https://${api_fqdn}" >> "$GITHUB_OUTPUT"
          echo "web_url=https://${web_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Run API smoke after rollback
        shell: pwsh
        run: ./scripts/smoke-api.ps1 -BaseUrl '${{ steps.urls.outputs.api_url }}'

      - name: Run web smoke after rollback
        shell: pwsh
        run: ./scripts/smoke-web.ps1 -BaseUrl '${{ steps.urls.outputs.web_url }}'
