name: ML Promote Dev

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Model version to promote in dev
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote-dev:
    runs-on: ubuntu-latest
    environment: azure-dev
    env:
      STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_MLOPS_STORAGE_ACCOUNT_NAME }}
      ARTIFACT_CONTAINER: ${{ vars.AZURE_MLOPS_ARTIFACT_CONTAINER }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      API_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_API_DEV }}
      MODEL_VERSION: ${{ github.event.inputs.model_version }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promote model in dev API config
        shell: bash
        run: |
          set -euo pipefail
          artifact_url="https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${ARTIFACT_CONTAINER}/models/${MODEL_VERSION}/ranker.pkl"
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              TRAVELTOM_ML_RANKER_ARTIFACT_URI="$artifact_url" \
              TRAVELTOM_ML_RANKER_PROMOTED_VERSION="$MODEL_VERSION"
