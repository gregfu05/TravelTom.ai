name: Deploy Dev

on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-dev:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: azure-dev
    concurrency:
      group: azure-dev-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.workflow_run.head_sha }}
      REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      API_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_API_DEV }}
      WEB_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_WEB_DEV }}
      API_IMAGE_NAME: traveltom-api
      WEB_IMAGE_NAME: traveltom-web
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      CHAT_PROVIDER: ${{ vars.DEV_CHAT_PROVIDER || 'ollama' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Azure workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$REGISTRY_NAME" ]] && missing+=("AZURE_CONTAINER_REGISTRY_NAME")
          [[ -z "$RESOURCE_GROUP" ]] && missing+=("AZURE_RESOURCE_GROUP_DEV")
          [[ -z "$API_APP_NAME" ]] && missing+=("AZURE_CONTAINER_APP_API_DEV")
          [[ -z "$WEB_APP_NAME" ]] && missing+=("AZURE_CONTAINER_APP_WEB_DEV")
          [[ -z "$IMAGE_TAG" ]] && missing+=("image_tag")
          [[ -z "$DATABASE_URL" ]] && missing+=("DEV_DATABASE_URL")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required environment vars: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run dev migrations
        shell: bash
        run: |
          set -euo pipefail
          alembic -c apps/api/alembic.ini upgrade head

      - name: Seed dev catalog when empty
        shell: bash
        run: |
          set -euo pipefail
          row_count=$(python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              db_url = os.environ["DATABASE_URL"].replace("+asyncpg", "", 1)
              conn = await asyncpg.connect(db_url)
              try:
                  row_count = await conn.fetchval("SELECT COUNT(*) FROM catalog_items")
              finally:
                  await conn.close()
              print(int(row_count or 0))


          asyncio.run(main())
          PY
          )
          echo "catalog_items row count before seed: $row_count"
          if [[ "$row_count" == "0" ]]; then
            python scripts/seed_catalog.py --batch-size 1000
          else
            echo "Skipping seed because catalog_items already contains rows."
          fi

      - name: Capture current active revisions
        id: current
        shell: bash
        run: |
          set -euo pipefail
          api_revision=$(az containerapp show -n "$API_APP_NAME" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          web_revision=$(az containerapp show -n "$WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          echo "api_revision=$api_revision" >> "$GITHUB_OUTPUT"
          echo "web_revision=$web_revision" >> "$GITHUB_OUTPUT"

      - name: Compute revision suffix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha=$(echo "$IMAGE_TAG" | cut -c1-7 | tr '[:upper:]' '[:lower:]')
          revision_suffix="dev-${short_sha}"
          echo "revision_suffix=$revision_suffix" >> "$GITHUB_OUTPUT"

      - name: Deploy API revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}-api"

      - name: Deploy web revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_NAME.azurecr.io/$WEB_IMAGE_NAME:$IMAGE_TAG" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}-web"

      - name: Resolve dev URLs
        id: urls
        shell: bash
        run: |
          api_fqdn=$(az containerapp show -n "$API_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          web_fqdn=$(az containerapp show -n "$WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "api_url=https://${api_fqdn}" >> "$GITHUB_OUTPUT"
          echo "web_url=https://${web_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Run API smoke
        shell: pwsh
        run: ./scripts/smoke-api.ps1 -BaseUrl '${{ steps.urls.outputs.api_url }}'

      - name: Run web smoke
        shell: pwsh
        run: ./scripts/smoke-web.ps1 -BaseUrl '${{ steps.urls.outputs.web_url }}'

      - name: Run chat smoke
        shell: pwsh
        run: ./scripts/smoke-chat-runtime.ps1 -BaseUrl '${{ steps.urls.outputs.api_url }}' -Provider '${{ env.CHAT_PROVIDER }}'

      - name: Roll back API revision on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision activate \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ steps.current.outputs.api_revision }}"

      - name: Roll back web revision on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision activate \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "${{ steps.current.outputs.web_revision }}"
