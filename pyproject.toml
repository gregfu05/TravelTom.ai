[project]
name = "traveltom"
version = "0.1.0"
description = "TravelTom backend services and tooling"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.110",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pgvector>=0.2.5",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "black>=24.3",
  "mypy>=1.8",
  "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["traveltom*"]
exclude = ["apps*", "docs*", "examples*", "infra*", "instructions*", "scripts*", "tests*", "venv*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
