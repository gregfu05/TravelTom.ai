name: traveltom-local

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traveltom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traveltom}
      POSTGRES_DB: ${POSTGRES_DB:-traveltom}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ${TRAVELTOM_PYTHON_IMAGE:-traveltom-local-python:latest}
    working_dir: /workspace
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-traveltom}:${POSTGRES_PASSWORD:-traveltom}@postgres:5432/${POSTGRES_DB:-traveltom}"
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - -c
      - apps/api/alembic.ini
      - upgrade
      - head
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ${TRAVELTOM_PYTHON_IMAGE:-traveltom-local-python:latest}
    working_dir: /workspace
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-traveltom}:${POSTGRES_PASSWORD:-traveltom}@postgres:5432/${POSTGRES_DB:-traveltom}"
    volumes:
      - ../..:/workspace
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --app-dir
      - apps/api
    restart: unless-stopped

  web:
    image: ${TRAVELTOM_NODE_IMAGE:-node:20-alpine}
    working_dir: /workspace/apps/web
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
    volumes:
      - ../..:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
